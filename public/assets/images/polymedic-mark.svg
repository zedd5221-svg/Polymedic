<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="pmMarkTitle">
  <title id="pmMarkTitle">Cotabato Polymedic &amp; Diagnostic Center</title>
  <!-- The clinic's seal, simplified for small sizes: blue ring, the staff and
       serpent in gold, the red cross at its base, a laurel sprig in green. -->

  <!-- Seal: white disc, blue ring -->
  <circle cx="32" cy="32" r="31" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#1E3A8A" stroke-width="3.6"/>

  <g transform="translate(32 32) scale(1.2) translate(-33 -31.5)">
  <!-- Laurel sprig, behind the staff -->
  <g fill="#2E9A4E">
    <path d="M38.5 49.5c4.2-3.6 7.6-8.6 9-15.2" fill="none" stroke="#2E9A4E" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M47.6 33.9c-3.1.3-5 2.2-5.3 4.9 3-.2 4.8-2.1 5.3-4.9z"/>
    <path d="M46.2 39.6c-2.9-.3-5 1.2-5.7 3.8 2.9.4 4.9-1.1 5.7-3.8z"/>
    <path d="M48.4 39.2c2.4-1.7 3.1-4.3 2.2-6.9-2.4 1.6-3.2 4.2-2.2 6.9z"/>
    <path d="M45.2 45.4c1.9-2.2 2.1-4.9.7-7.2-1.9 2.1-2.1 4.8-.7 7.2z"/>
  </g>

  <!-- Staff -->
  <rect x="29.6" y="12.5" width="4.2" height="36" rx="2.1" fill="#E8901F"/>
  <circle cx="31.7" cy="12.6" r="2.6" fill="#D2451E"/>

  <!-- Serpent coiling up the staff -->
  <path d="M27.4 43.5c-4.6-1.1-4.4-5.6.2-6.6 4.9-1.1 9.2-2.1 9-5.9-.2-3.4-4.6-4-8.6-4.6-4.3-.7-6-4.5-1.5-6.6 3-1.4 7.4-1 9.6-3"
        fill="none" stroke="#F4A93B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27.4 43.5c-4.6-1.1-4.4-5.6.2-6.6 4.9-1.1 9.2-2.1 9-5.9-.2-3.4-4.6-4-8.6-4.6-4.3-.7-6-4.5-1.5-6.6 3-1.4 7.4-1 9.6-3"
        fill="none" stroke="#B9661A" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <ellipse cx="37.6" cy="15.9" rx="2.9" ry="2.1" fill="#F4A93B" transform="rotate(-24 37.6 15.9)"/>
  <circle cx="38.5" cy="15.4" r="0.7" fill="#5A2E0B"/>

  <!-- Red cross at the base -->
  <path d="M19.8 38.2h5v-5h5.4v5h5v5.4h-5v5h-5.4v-5h-5z" fill="#E5322D" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
